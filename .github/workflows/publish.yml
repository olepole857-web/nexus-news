name: NEXUS NEWS – RSS aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nachrichten aus RSS-Feeds abrufen
        run: python scripts/update_news.py
      - name: Statische Webseite vorbereiten
        run: |
          mkdir -p _site
          cp index.html news.json _site/
          touch _site/.nojekyll
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Webseite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
